
name: Action 2 - One Test Case Fails

on:
  workflow_dispatch:

jobs:
  failure-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run Intentional Failure Test
        run: |
          mkdir -p failure-demo/src/test/java/demo
          cat > failure-demo/src/test/java/demo/FailureDemoTest.java <<'EOF'
          package demo;

          import org.junit.jupiter.api.Test;
          import static org.junit.jupiter.api.Assertions.assertEquals;

          class FailureDemoTest {

              @Test
              void intentionalFailureTest() {
                  assertEquals(100, 90,
                      "Intentional test failure demonstration");
              }
          }
          EOF

          cat > failure-demo/pom.xml <<'EOF'
          <project xmlns="http://maven.apache.org/POM/4.0.0"
              xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
              xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <groupId>demo</groupId>
              <artifactId>failure-demo</artifactId>
              <version>1.0</version>
              <properties>
                  <maven.compiler.release>17</maven.compiler.release>
                  <junit.version>5.11.4</junit.version>
              </properties>
              <dependencies>
                  <dependency>
                      <groupId>org.junit.jupiter</groupId>
                      <artifactId>junit-jupiter</artifactId>
                      <version>${junit.version}</version>
                      <scope>test</scope>
                  </dependency>
              </dependencies>
              <build>
                  <plugins>
                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-surefire-plugin</artifactId>
                          <version>3.5.2</version>
                      </plugin>
                  </plugins>
              </build>
          </project>
          EOF

          cd failure-demo
          mvn test
